services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: siteforge
      POSTGRES_USER: siteforge
      POSTGRES_PASSWORD: siteforge_local
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - siteforge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteforge -d siteforge"]
      interval: 5s
      retries: 10
volumes:
  siteforge_pgdata:
